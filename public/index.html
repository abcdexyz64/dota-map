<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota Map</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup" aria-label="Dota Map">
        <span class="brand-word">Dota</span><span class="brand-block">Map</span>
      </div>
      <div class="top-actions">
        <div class="segmented" role="group" aria-label="Language">
          <button id="langZh" class="segment active" type="button">中文</button>
          <button id="langEn" class="segment" type="button">EN</button>
        </div>
        <button id="openFolderBtn" class="ghost-button" type="button" data-i18n="openFolder">打开目录</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel side-panel">
        <div class="panel-heading">
          <span class="eyebrow" data-i18n="availableMaps">可用地图</span>
          <strong id="mapCount">0</strong>
        </div>
        <div class="path-box">
          <label for="mapsDir" data-i18n="mapsDir">地图目录</label>
          <div class="path-row">
            <input id="mapsDir" type="text" spellcheck="false">
            <button id="scanBtn" class="small-button" type="button" data-i18n="scan">扫描</button>
          </div>
        </div>
        <div id="mapList" class="map-list"></div>
      </aside>

      <section class="panel switch-panel">
        <div class="status-row">
          <div>
            <span class="eyebrow" data-i18n="activeSlot">当前启用槽位</span>
            <h1 id="slotTitle">Winter Slot</h1>
          </div>
          <span id="statusBadge" class="status-badge" data-i18n="ready">准备就绪</span>
        </div>

        <div id="activeStateBox" class="active-state-box">
          <strong id="actualMapTitle">自动检测</strong>
          <p id="activeStateText"></p>
        </div>

        <div class="switch-grid">
          <article class="terrain-card current">
            <div id="slotArt" class="terrain-art winter-art"></div>
            <div class="terrain-meta">
              <span data-i18n="slotFile">槽位文件名</span>
              <select id="slotSelect"></select>
            </div>
          </article>

          <article class="terrain-card selected">
            <div id="sourceArt" class="terrain-art halloween-art"></div>
            <div class="terrain-meta">
              <span data-i18n="replacementFile">准备替换为</span>
              <select id="sourceSelect"></select>
              <div id="compatibilityBox" class="compatibility-box"></div>
            </div>
          </article>
        </div>

        <div class="primary-actions">
          <button id="switchBtn" class="primary-button" type="button" data-i18n="switchMap">一键替换地图</button>
        </div>
        <div class="secondary-actions">
          <button id="dryRunBtn" class="ghost-button" type="button" data-i18n="dryRun">模拟执行</button>
          <button id="restoreBtn" class="ghost-button" type="button" data-i18n="restore">恢复备份</button>
          <button id="refreshBackupsBtn" class="ghost-button" type="button" data-i18n="refresh">刷新</button>
        </div>

        <div id="messageBox" class="message-box" aria-live="polite"></div>
      </section>

      <aside class="panel queue-panel">
        <span class="eyebrow" data-i18n="operationQueue">执行队列</span>
        <ol class="queue-list">
          <li data-i18n="stepClose">检查 Dota 是否关闭</li>
          <li data-i18n="stepBackup">创建时间戳备份</li>
          <li data-i18n="stepSwap">交换地图文件名</li>
          <li data-i18n="stepRecord">写入可恢复记录</li>
        </ol>

        <div class="backup-box">
          <div class="panel-heading compact">
            <span class="eyebrow" data-i18n="backups">备份</span>
            <strong id="backupCount">0</strong>
          </div>
          <select id="backupSelect"></select>
        </div>

        <div class="chat-bind-box">
          <div class="panel-heading compact">
            <span class="eyebrow" data-i18n="chatBinds">喊话绑定</span>
            <strong id="chatBindStatus">OFF</strong>
          </div>
          <label for="cfgPath" data-i18n="cfgFile">配置文件</label>
          <input id="cfgPath" type="text" readonly spellcheck="false">

          <div class="bind-grid">
            <label for="predictionKey">
              <span data-i18n="predictionKey">预测按键</span>
              <input id="predictionKey" type="text" maxlength="32" spellcheck="false">
            </label>
            <label for="abandonKey">
              <span data-i18n="abandonKey">逃跑按键</span>
              <input id="abandonKey" type="text" maxlength="32" spellcheck="false">
            </label>
          </div>

          <label for="predictionMessages" data-i18n="predictionMessages">预测喊话</label>
          <textarea id="predictionMessages" class="chat-textarea" rows="3" spellcheck="false"></textarea>

          <label for="abandonMessages" data-i18n="abandonMessages">逃跑恶搞喊话</label>
          <textarea id="abandonMessages" class="chat-textarea" rows="3" spellcheck="false"></textarea>

          <div class="bind-actions">
            <button id="applyChatBindsBtn" class="small-button" type="button" data-i18n="applyChatBinds">写入 CFG</button>
            <button id="previewChatBindsBtn" class="ghost-button" type="button" data-i18n="previewCfg">预览</button>
            <button id="removeChatBindsBtn" class="ghost-button" type="button" data-i18n="removeChatBinds">移除</button>
          </div>
          <p class="cfg-hint" data-i18n="cfgHint">第一行在按下按键时发送，后续行在松开按键时发送；* 会写成 KP_MULTIPLY，- 会写成 MINUS。为避免误执行命令，内容不允许包含英文分号或引号。</p>
        </div>

        <div class="release-note">
          <strong data-i18n="releaseBoundaryTitle">开源发布边界</strong>
          <p data-i18n="releaseBoundaryText">仓库只包含工具源码，不内置或分发任何 Dota 地图文件。</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
